name: WorksAI Live Interpreter CI/CD (translate.worksai.org)

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worksai-live-interpreter-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-and-test:
    name: Syntax, Secret Hygiene, Doctor & Qualification Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Syntax & Module Verification
        run: npm run lint

      - name: Run Secret & Credential Hygiene Scan
        run: npm run secret-scan

      - name: Run CLI Doctor & Provenance Self-Check
        run: npm run doctor

      - name: Run v1.3.1 CI Qualification & Security Contract Suite
        run: npm test

      - name: Verify RELEASE-MANIFEST.json Integrity
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import crypto from "node:crypto";
            const m = JSON.parse(fs.readFileSync("RELEASE-MANIFEST.json", "utf8"));
            let verifiedCount = 0;
            for (const [file, meta] of Object.entries(m.files)) {
              if (!fs.existsSync(file)) continue;
              const data = fs.readFileSync(file);
              const sha = crypto.createHash("sha256").update(data).digest("hex");
              if (sha !== meta.sha256) {
                console.error(`Checksum mismatch for ${file}: expected ${meta.sha256}, got ${sha}`);
                process.exit(1);
              }
              verifiedCount++;
            }
            console.log(`✓ Verified ${verifiedCount} repository files against RELEASE-MANIFEST.json.`);
          '

      - name: Upload Verified Release Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: worksai-live-interpreter-v1.3.1-manifest
          path: |
            RELEASE-MANIFEST.json
            SHA256SUMS.txt
            CHANGELOG.md
            docs/marketing/security-release-draft.md

  deploy-production:
    name: Deploy to Cloudflare Workers (translate.worksai.org)
    needs: verify-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'DevinAiUk/gpt-realtime-translate-live-event-interpreter'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: worksai-live-interpreter-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Required Cloudflare Deployment Secrets
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACC_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_PRESENT" != "true" ] || [ "$CF_ACC_PRESENT" != "true" ]; then
            echo "::error::Configuration blocker: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are required for automated Wrangler deployment."
            exit 1
          fi

      - name: Deploy Worker via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-Deploy Live Smoke Check (translate.worksai.org)
        run: |
          curl --fail --silent --show-error https://translate.worksai.org/health | grep '"status": "healthy"'
          curl --fail --silent --show-error https://translate.worksai.org/api/mcp/manifest | grep '"worksai-live-interpreter-mcp"'
